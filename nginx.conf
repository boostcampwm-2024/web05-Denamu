# Blue-Green 무중단 배포용 backend upstream.
# 실제 active 포트(blue=8080 / green=8081)는 배포 스크립트가 관리하는
# /etc/nginx/conf.d/denamu_active_backend.conf (server 127.0.0.1:<port>;) 에서 결정된다.
# 이 파일은 런타임에 동적으로 교체되므로 git 으로 관리하지 않는다.
upstream denamu_backend {
    include /etc/nginx/conf.d/denamu_active_backend.conf;
}

# OG(Open Graph) 스크래퍼 감지 - 게시글 상세 경로에서 봇에게만 서버 렌더링 메타태그를 응답
map $http_user_agent $is_og_bot {
    default 0;
    ~*facebookexternalhit 1;
    ~*Twitterbot 1;
    ~*Slackbot 1;
    ~*TelegramBot 1;
    ~*Discordbot 1;
    ~*LinkedInBot 1;
    ~*KakaoTalk-Scrap 1;
    ~*Googlebot 1;
    ~*bingbot 1;
    ~*Yeti 1;
    ~*bot 1;
}

# HTTP로 들어오는 요청을 HTTPS로 Redirect
server {
    listen 80;
    server_name denamu.dev www.denamu.dev;

    return 301 https://$host$request_uri;
}

# Grafana 서브도메인 - HTTP to HTTPS Redirect
server {
    listen 80;
    server_name grafana.denamu.dev;

    return 301 https://$host$request_uri;
}

# Grafana 서브도메인 - HTTPS 프록시
server {
    listen 443 ssl;
    server_name grafana.denamu.dev;

    ssl_certificate /etc/letsencrypt/live/denamu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denamu.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Portainer 서브도메인 - HTTP to HTTPS Redirect
server {
    listen 80;
    server_name portainer.denamu.dev;

    return 301 https://$host$request_uri;
}

# Portainer 서브도메인 - HTTPS 프록시
server {
    listen 443 ssl;
    server_name portainer.denamu.dev;

    ssl_certificate /etc/letsencrypt/live/denamu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denamu.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# HTTPS로 들어온 요청에 대한 처리 진행
server {
    listen 443 ssl;
    server_name denamu.dev www.denamu.dev;

    ssl_certificate /etc/letsencrypt/live/denamu.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/denamu.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # 정적 파일 서빙 - FE 빌드 파일
    location / {
        root /var/dist;
        index index.html;
        try_files $uri /index.html;
    }

    # 게시글 상세 경로 - OG 스크래퍼 봇이면 서버 렌더링 메타태그 HTML로, 아니면 기존 SPA로
    location ~ ^/[0-9]+$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($is_og_bot) {
            proxy_pass http://denamu_backend/api/feeds$uri/og;
            break;
        }

        root /var/dist;
        try_files $uri /index.html;
    }

    # 프로필 상세 경로 - OG 스크래퍼 봇이면 서버 렌더링 메타태그 HTML로, 아니면 기존 SPA로
    location ~ ^/profile/([0-9]+)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($is_og_bot) {
            proxy_pass http://denamu_backend/api/users/$1/profile/og;
            break;
        }

        root /var/dist;
        try_files $uri /index.html;
    }

    # RSS(블로그) 상세 경로 - OG 스크래퍼 봇이면 서버 렌더링 메타태그 HTML로, 아니면 기존 SPA로
    location ~ ^/rss/([0-9]+)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($is_og_bot) {
            proxy_pass http://denamu_backend/api/rss/$1/og;
            break;
        }

        root /var/dist;
        try_files $uri /index.html;
    }

    # 정적 파일 서빙
    location /files {
        alias /var/prod_data/static/;
        try_files $uri $uri/ =404;
    }

    # 파일 업로드 서비스에 의해 관리되는 정적 파일 서빙
    location /objects {
        alias /var/prod_data/objects;
        try_files $uri $uri/ =404;
    }

    # API 요청을 NestJS로 프록시
    location /api {
        proxy_pass http://denamu_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;

        proxy_set_header X-Real-IP $remote_addr;  # X-Real-IP 헤더로 실제 IP 전달
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # X-Forwarded-For 헤더로 실제 IP 전달
        proxy_set_header X-Forwarded-Proto $scheme; # 클라이언트의 프로토콜 전달
    }

    # WebSocket 요청 프록시
    location /socket.io {
        proxy_pass http://denamu_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header X-Real-IP $remote_addr;  # X-Real-IP 헤더로 실제 IP 전달
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # X-Forwarded-For 헤더로 실제 IP 전달
        proxy_set_header X-Forwarded-Proto $scheme; # 클라이언트의 프로토콜 전달
    }
}